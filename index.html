<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css" />
<style>
  :root {
    --bg: #faf7f6;
    --surface: #ffffff;
    --surface-2: #fdf8f7;
    --text: #241c1e;
    --muted: #746664;
    --subtle: #ab9c99;
    --line: rgba(36, 20, 22, 0.08);
    --line-strong: rgba(36, 20, 22, 0.15);
    --accent: #c46685;
    --accent-2: #8b6fd6;
    --mint: #0ea371;
    --gold: #c9a15c;
    --radius: 18px;
    --radius-sm: 12px;
    --max-width: 1200px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Helvetica Neue", Arial, sans-serif;
    line-height: 1.6;
    overflow-x: hidden;
  }
  .glow-field { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .glow { position: absolute; width: 760px; height: 760px; border-radius: 50%; filter: blur(150px); opacity: 0.12; animation: drift 18s ease-in-out infinite alternate; }
  .glow.g1 { background: var(--accent); top: -220px; left: -160px; }
  .glow.g2 { background: var(--accent-2); top: 30%; right: -280px; animation-delay: -6s; }
  .glow.g3 { background: var(--gold); bottom: -260px; left: 25%; animation-delay: -12s; }
  @keyframes drift { from { transform: translate(0, 0) scale(1); } to { transform: translate(60px, -50px) scale(1.12); } }

  .report { position: relative; z-index: 1; max-width: var(--max-width); margin: 0 auto; padding: 56px 40px 90px; }
  .hero { padding: 44px 0 40px; border-bottom: 1px solid var(--line); }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 18px; border: 1px solid var(--line-strong); border-radius: 999px; padding: 7px 14px;
    background: rgba(36, 20, 22, 0.02);
  }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 0 0 rgba(14, 163, 113, 0.6); animation: pulse 2s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(14, 163, 113, 0.55); } 70% { box-shadow: 0 0 0 10px rgba(14, 163, 113, 0); } 100% { box-shadow: 0 0 0 0 rgba(14, 163, 113, 0); } }
  .title { font-size: 54px; line-height: 1.14; font-weight: 800; letter-spacing: -0.03em; margin: 0 0 18px; }
  .title .grad { background: linear-gradient(92deg, var(--accent) 0%, var(--accent-2) 60%, var(--gold) 120%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .subtitle2 { font-size: 15px; font-weight: 500; color: var(--subtle); margin-bottom: 26px; }
  .pillstat-row { display: flex; gap: 14px; flex-wrap: wrap; }
  .pillstat { border: 1px solid var(--line-strong); border-radius: 999px; padding: 10px 18px; display: flex; align-items: baseline; gap: 8px; background: var(--surface); }
  .pillstat b { font-size: 17px; font-weight: 800; background: linear-gradient(92deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .pillstat span { font-size: 12.5px; color: var(--muted); }

  .section { padding: 46px 0; border-bottom: 1px solid var(--line); }
  .section h2 { font-size: 29px; line-height: 1.25; margin: 0 0 8px; letter-spacing: -0.02em; font-weight: 700; }
  .section h2 .num { font-size: 13px; color: var(--accent); font-weight: 700; letter-spacing: 0.12em; display: block; margin-bottom: 8px; }
  .section-intro { color: var(--muted); max-width: 860px; margin: 0 0 26px; font-size: 15.5px; }
  .source-tag { display: inline-block; font-size: 12px; color: var(--subtle); margin-bottom: 22px; border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; }

  .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
  .card {
    border: 1px solid var(--line); border-radius: var(--radius); padding: 22px;
    background: linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%);
    transition: transform 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
  }
  .card:hover { transform: translateY(-4px); border-color: var(--line-strong); box-shadow: 0 18px 44px rgba(36, 20, 22, 0.1); }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; padding: 3px 9px; border-radius: 999px; background: rgba(14, 163, 113, 0.1); color: #0c8f63; border: 1px solid rgba(14, 163, 113, 0.3); }
  .tag.violet { background: rgba(139, 111, 214, 0.12); color: #6a4fc4; border-color: rgba(139, 111, 214, 0.35); }
  .tag.pink { background: rgba(196, 102, 133, 0.12); color: #a94769; border-color: rgba(196, 102, 133, 0.35); }
  .pill-wrap { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .insight { margin-top: 22px; padding: 16px 18px; border-left: 3px solid var(--accent); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; background: rgba(196, 102, 133, 0.07); font-size: 14.5px; color: #4a3d3f; }
  .insight strong { color: var(--text); }
  .note-box { margin-top: 16px; padding: 14px 16px; border: 1px dashed var(--line-strong); border-radius: var(--radius-sm); font-size: 13.5px; color: var(--muted); background: rgba(36, 20, 22, 0.02); }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .case-title { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 14px; }
  .list { margin: 0; padding-left: 18px; color: #4a3d3f; }
  .list li { margin-bottom: 9px; }
  .list li::marker { color: var(--accent); }

  /* rank list (hashtag ranking) */
  .rank-list { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  .rank-row { display: flex; align-items: center; gap: 14px; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px 16px; background: rgba(36, 20, 22, 0.015); }
  .rank-badge { flex: none; width: 40px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; }
  .rank-tag { font-weight: 700; font-size: 14.5px; color: var(--text); flex: 1; min-width: 160px; }
  .rank-stat { font-size: 12.5px; color: var(--muted); text-align: right; }

  .metric-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 18px; }
  .metric-strip.cols-2 { grid-template-columns: repeat(2, 1fr); }
  .metric-mini { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 14px; background: rgba(36, 20, 22, 0.015); }
  .metric-mini.win { border-color: rgba(14, 163, 113, 0.35); background: rgba(14, 163, 113, 0.07); }
  .metric-mini span { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
  .metric-mini strong { font-size: 21px; letter-spacing: -0.02em; }
  .metric-mini.win strong { color: #0c8f63; }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; vertical-align: top; padding: 12px 10px; border-bottom: 1px solid var(--line); }
  th { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
  td { color: #4a3d3f; }

  /* product spotlight */
  .product-wrap { display: grid; grid-template-columns: 280px 1fr; gap: 30px; align-items: center; }
  .product-photo { border-radius: var(--radius); overflow: hidden; background: #fbf6f4; padding: 10px; border: 1px solid var(--line); }
  .product-photo img { width: 100%; display: block; border-radius: calc(var(--radius) - 8px); }
  @media (max-width: 780px) { .product-wrap { grid-template-columns: 1fr; } }

  /* content-type / proof cards with image */
  .media-card { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
  .media-card .media-photo { aspect-ratio: 4 / 5; overflow: hidden; background: #f2eae7; }
  .media-card .media-photo img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.5s ease; }
  .media-card:hover .media-photo img { transform: scale(1.04); }
  .media-card .media-body { padding: 18px 20px 22px; }
  .media-card h3 { font-size: 17px; margin: 0 0 8px; font-weight: 700; }
  .media-card p { font-size: 13.5px; color: var(--muted); margin: 0; }

  .num-badge { width: 32px; height: 32px; border-radius: 9px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; margin-bottom: 12px; }

  .checklist { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 10px; }
  .checklist li { display: flex; gap: 12px; align-items: flex-start; font-size: 14px; color: #33272a; background: rgba(36, 20, 22, 0.015); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .checklist li .box { flex: none; width: 16px; height: 16px; margin-top: 3px; border-radius: 5px; border: 2px solid var(--accent); }

  .proof-photo { border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); }
  .proof-photo img { width: 100%; display: block; }

  .quote-box {
    border: 1px solid transparent; border-radius: var(--radius); padding: 28px; font-size: 18px; line-height: 1.55; letter-spacing: -0.015em;
    background: linear-gradient(180deg, var(--surface), var(--surface-2)) padding-box, linear-gradient(135deg, rgba(196, 102, 133, .55), rgba(139, 111, 214, .5)) border-box;
    color: #33272a;
  }
  .footer { font-size: 13px; color: var(--muted); line-height: 1.7; padding-top: 28px; }
  .footer a { color: var(--text); text-decoration: none; border-bottom: 1px solid var(--line-strong); }
  .reveal { opacity: 0; transform: translateY(24px); transition: opacity 0.7s ease, transform 0.7s ease; }
  .reveal.in { opacity: 1; transform: none; }

  @media (max-width: 1024px) {
    .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; }
    .title { font-size: 38px; }
    .report { padding: 32px 20px 60px; }
  }
</style>
</head>
